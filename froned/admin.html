<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="admin.title">Panel de Administración - Sapy'Aite</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <h1><span data-i18n="admin.panel">Panel de Control</span> <span>Sapy'Aite</span></h1>
      <button id="logoutBtn" class="btn-logout" data-i18n="admin.cerrar">Cerrar Sesión</button>
    </header>

    <main class="admin-main">
      <!-- Formulario para crear/editar producto -->
      <section class="product-form-section">
        <h2 data-i18n="admin.producto">Producto</h2>
        <form id="productForm">
          <input type="hidden" id="productId" value="">
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="admin.nombre">Nombre *</label>
              <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
              <label data-i18n="admin.categoria">Categoría *</label>
              <select id="categoriaId" required></select>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="admin.descripcion">Descripción</label>
            <textarea id="descripcion" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="admin.precio">Precio *</label>
              <input type="number" id="precio" step="0.01" required>
            </div>
            <div class="form-group">
              <label data-i18n="admin.urlImagen">URL Imagen</label>
              <input type="text" id="imagenUrl" placeholder="https://...">
            </div>
          </div>
          <div class="form-group checkbox">
            <label>
              <input type="checkbox" id="disponible" checked> <span data-i18n="admin.disponible">Disponible</span>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-save" data-i18n="admin.guardar">Guardar producto</button>
            <button type="button" id="cancelEditBtn" class="btn-cancel" data-i18n="admin.cancelar">Cancelar edición</button>
          </div>
        </form>
      </section>

      <!-- Listado de productos -->
      <section class="product-list-section">
        <h2 data-i18n="admin.lista">Lista de productos</h2>
        <div class="table-responsive">
          <table id="productsTable">
            <thead>
              <tr><th data-i18n="admin.th.id">ID</th><th data-i18n="admin.th.nombre">Nombre</th><th data-i18n="admin.th.categoria">Categoría</th><th data-i18n="admin.th.precio">Precio</th><th data-i18n="admin.th.disponible">Disponible</th><th data-i18n="admin.th.acciones">Acciones</th></tr>
            </thead>
            <tbody id="productsTbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="admin.js"></script>
</body>
</html>
